<div class="periodo-bar">
  <span style="font-size: 13px; color: var(--gray-500); font-weight: 700; margin-right: 4px;">Periodo:</span>
  @for (op of opciones; track op.key) {
    <button
      type="button"
      (click)="setPeriodo(op.key)"
      class="btn btn-sm"
      [class.btn-primary]="periodo.periodo.rangeMode === op.key"
      [class.btn-outline]="periodo.periodo.rangeMode !== op.key"
    >{{ op.label }}</button>
  }
  @if (periodo.periodo.rangeMode === 'custom') {
    <input
      class="form-input"
      type="date"
      [ngModel]="periodo.periodo.customFrom"
      (ngModelChange)="periodo.periodo.customFrom = $event"
      style="width: auto; padding: 6px 8px;"
    />
    <span style="color: var(--gray-500); font-size: 13px;">a</span>
    <input
      class="form-input"
      type="date"
      [ngModel]="periodo.periodo.customTo"
      (ngModelChange)="periodo.periodo.customTo = $event"
      style="width: auto; padding: 6px 8px;"
    />
    <button type="button" class="btn btn-primary btn-sm" (click)="aplicarCustom()">Aplicar</button>
  }
</div>
